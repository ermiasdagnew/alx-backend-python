apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging-green
spec:
  replicas: 1
  selector:
    matchLabels:
      version: green
  template:
    metadata:
      labels:
        version: green
        app: messaging-app
    spec:
      containers:
      - name: messaging-green
        image: yourdockerhubusername/messaging_app:1.1
        ports:
        - containerPort: 8000
